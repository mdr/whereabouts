name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nix in CI, kept simple: the installer action plus cache.nixos.org. The
# action installs Determinate Nix (the installer has ignored requests for
# upstream Nix since 2026) and skips its FlakeHub login without id-token. The
# checks only realise a dev shell whose every path is in the public cache,
# and the image build is under a minute, so a per-repo Nix cache buys
# nothing: the Magic Nix Cache's post-run upload was costing one to three
# minutes per job. What does need caching across runs is the pnpm store,
# which actions/cache handles.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Locate pnpm store
        id: pnpm
        run: echo "dir=$(nix develop .#ci -c pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop .#ci -c pnpm install --frozen-lockfile
      - name: Typecheck, lint, format, test
        run: nix develop .#ci -c pnpm check
      - name: Build client
        run: nix develop .#ci -c pnpm build

  # Build the container with Nix and push it to Fly's registry, tagged with
  # the commit, while the checks run: an image in the registry is not live,
  # the deploy job below is what rolls it out, and only once the checks pass.
  # The image is a Nix build that exists only on this runner, so the push has
  # to happen here rather than in the deploy job. Needs the FLY_API_TOKEN
  # secret: a deploy token scoped to the app, minted by scripts/fly-bootstrap.sh.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/whereabouts-game:${{ github.sha }}
    steps:
      # Until the secret exists (see README, Deploy) this job and the deploy
      # pass but do nothing, so a fresh clone of the repo still has green CI.
      - name: Check for deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret not set; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.token.outputs.present == 'true'
      # No Nix cache here either: the image build is well under a minute
      # from cache.nixos.org plus the pnpm fetch, and the Magic Nix Cache's
      # post-run upload of the image closure cost more than that.
      - name: Build image
        if: steps.token.outputs.present == 'true'
        run: nix build .#image --no-link --print-out-paths > image-streamer
      - name: Push image
        if: steps.token.outputs.present == 'true'
        run: |
          "$(cat image-streamer)" | nix develop .#deploy -c skopeo copy \
            --insecure-policy \
            --dest-creds "x:$FLY_API_TOKEN" \
            docker-archive:/dev/stdin "docker://$IMAGE"

  # Roll out the image pushed above, once the checks have passed too.
  deploy:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/whereabouts-game:${{ github.sha }}
    steps:
      - name: Check for deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret not set; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.token.outputs.present == 'true'
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: nix develop .#deploy -c fly deploy --image "$IMAGE" --ha=false --yes

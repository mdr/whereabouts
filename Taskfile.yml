# The menu of what can be run in this repository: `task --list`. Run inside
# `nix develop`, which provides `task`, e.g. `nix develop -c task e2e`.
version: "3"

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  # ----------------------------------------------------------- developing

  dev:
    desc: Run the client (http://localhost:5173) and the game server (:8787), reloading on changes
    cmds:
      - pnpm dev

  dev:short:
    desc: Like dev, with 12-second rounds and 2-round games, for trying the flow of a game
    env:
      ROUND_MS: "12000"
      ROUNDS: "2"
    cmds:
      - pnpm dev

  tunnel:
    desc: Reach the dev client from a VR headset, over HTTPS (open the trycloudflare.com address it prints)
    summary: |
      A Cloudflare quick tunnel to http://localhost:5173, since WebXR needs
      HTTPS. Anyone with the address can reach the dev server: stop it when
      done. See the README, "On a VR headset".
    cmds:
      - nix shell nixpkgs#cloudflared -c cloudflared tunnel --url http://localhost:5173

  # ------------------------------------------------------------- checking

  check:
    desc: Everything CI checks, bar the build - formatting, lint, types, unused code and the unit tests
    cmds:
      - pnpm check

  fix:
    desc: Format, and apply the lint fixes that can be made automatically
    cmds:
      - pnpm format
      - pnpm lint:fix

  test:
    desc: The unit tests (task test -- paint for those matching a name)
    cmds:
      - pnpm test {{.CLI_ARGS}}

  iwft:
    desc: "The isolated browser tests, *.iwft.ts (task iwft -- solo host for some)"
    summary: |
      Playwright Test starts a Vite dev server of its own on a free port (or
      CLIENT_PORT), so runs in other worktrees and a `pnpm dev` are left alone.
      Each test that plays starts the game server in its own process, and
      tabs answer the network from the offline world, so nothing else needs
      to be up and they run offline. Runs every *.iwft.ts in
      packages/client/browser/tests, or those whose paths match the words
      after --, three at a time. Screenshots go to smoke-out/iwft/, a report
      to smoke-out/iwft-report/.
    cmds:
      - pnpm --filter ./packages/client iwft {{.CLI_ARGS}}

  e2e:
    desc: "The end-to-end browser tests, *.e2e.ts, against dev servers of their own (task e2e -- multiplayer)"
    summary: |
      Playwright Test starts Vite and the game server on free ports (or
      CLIENT_PORT and PORT), with short rounds, and runs the
      *.e2e.ts specs against them over the real network. Screenshots go to
      smoke-out/e2e/, a report to smoke-out/e2e-report/.
    cmds:
      - pnpm --filter ./packages/client e2e {{.CLI_ARGS}}

  screenshots:
    desc: "The screenshot tests, *.screenshot.ts, at desktop and phone size (task screenshots -- --update-snapshots to save new pictures)"
    cmds:
      - pnpm --filter ./packages/client screenshots {{.CLI_ARGS}}

  browser:
    desc: Every browser test, the isolated ones then the end-to-end ones
    cmds:
      - task: iwft
      - task: e2e

  # --------------------------------------------------- the production build

  build:
    desc: Build the client bundle into packages/client/dist, as CI does
    cmds:
      - pnpm build

  serve:prod:
    desc: Build and serve the production package locally, on :8799, as the container runs it
    env:
      PORT: "8799"
    cmds:
      - nix run

  e2e:prod:
    desc: Check a production build loads the map - task serve:prod first, or name a site (task e2e:prod -- https://…)
    env:
      PROD_URL: "{{.CLI_ARGS}}"
    cmds:
      - pnpm --filter ./packages/client e2e:prod

  nix:hash:
    desc: Update the Nix package's pnpm dependency hash after the lockfile changes (pnpm check says when)
    cmds:
      - node --experimental-strip-types scripts/update-pnpm-deps.ts

  # ------------------------------------------------------------------- Fly

  fly:status:
    desc: The live app's machines and their state
    cmds:
      - scripts/fly.sh status

  fly:logs:
    desc: The live app's recent logs (task fly:logs -- --no-tail to print and stop)
    cmds:
      - scripts/fly.sh logs {{.CLI_ARGS}}
